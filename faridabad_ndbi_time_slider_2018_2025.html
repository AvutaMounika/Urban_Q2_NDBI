map.fitBounds(b.getBounds());

const slider = document.getElementById("yearSlider");
const label  = document.getElementById("yearLabel");
const playBtn = document.getElementById("playBtn");
let current = 0, timer = null;

function showYear(i) {
  current = i;
  years.forEach(function (y, k) { layers[y].setOpacity(k === i ? 0.85 : 0); });
  label.textContent = "Jan–Mar " + years[i] + "  (" + sources[String(years[i])] + ")";
  slider.value = i;
}
slider.addEventListener("input", function () { stop(); showYear(Number(this.value)); });

function play() {
  playBtn.textContent = "⏸ Pause";
  timer = setInterval(function () { showYear((current + 1) % years.length); }, 1200);
}
function stop() {
  if (timer) { clearInterval(timer); timer = null; }
  playBtn.textContent = "▶ Play";
}
playBtn.addEventListener("click", function () { timer ? stop() : play(); });

const legend = L.control({position: "bottomright"});
legend.onAdd = function () {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = "<b>NDBI</b><div class='gradient'></div>" +
    "<div class='lbl'><span>-0.5</span><span>0</span><span>+0.5</span></div>";
  return d;
};
legend.addTo(map);

showYear(0);
</script></body></html>
